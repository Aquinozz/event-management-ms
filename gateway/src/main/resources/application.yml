spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**,/users/**
            - id: event-service
              uri: ${EVENT_URL:http://localhost:8082}
              predicates:
                - Path=/events/**,/categories/**
            - id: notification-service
              uri: ${NOTIFICATION_URL:http://localhost:8083}
              predicates:
                - Path=/notifications/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
