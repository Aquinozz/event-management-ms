services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: em-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: em-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    container_name: em-auth-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET:-MinhaChaveSuperSecretaComPeloMenos32Caracteres}
    volumes:
      - auth-data:/app/data

  event-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: event-service
    container_name: em-event-service
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET:-MinhaChaveSuperSecretaComPeloMenos32Caracteres}
      AUTH_URL: http://auth-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - event-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    container_name: em-notification-service
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET:-MinhaChaveSuperSecretaComPeloMenos32Caracteres}
      AUTH_URL: http://auth-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - notification-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    container_name: em-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_URL: http://auth-service:8081
      EVENT_URL: http://event-service:8082
      NOTIFICATION_URL: http://notification-service:8083
    depends_on:
      - auth-service
      - event-service
      - notification-service

volumes:
  auth-data:
  event-data:
  notification-data:
