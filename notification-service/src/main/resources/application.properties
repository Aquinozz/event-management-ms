spring.application.name=notification-service
server.port=8083

spring.datasource.url=${DATASOURCE_URL:jdbc:h2:file:./data/notification-db}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=localhost:9093
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

springdoc.api-docs.path=/eventos-api-docs
springdoc.swagger-ui.url=/eventos-api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:MinhaChaveSuperSecretaComPeloMenos32Caracteres}
auth.url=${AUTH_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,metrics,prometheus
