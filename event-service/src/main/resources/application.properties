spring.application.name=event-service
server.port=8082

spring.datasource.url=${DATASOURCE_URL:jdbc:h2:file:./data/event-db}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

springdoc.api-docs.path=/eventos-api-docs
springdoc.swagger-ui.url=/eventos-api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:MinhaChaveSuperSecretaComPeloMenos32Caracteres}
auth.url=${AUTH_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,metrics,prometheus
